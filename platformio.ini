[env:aqualight]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_CONTROL_VERSION=\"1.1.0\"
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    https://github.com/enjoyneering/AHTxx.git#701814ca270a019ae2a66b3371e7829b73769918

; Single-channel board: PWM GPIO4, AHT20 SDA GPIO1 / SCL GPIO0, own OTA channel.
[env:aqualight1ch]
extends = env:aqualight
build_flags =
    ${env:aqualight.build_flags}
    -DLED_CHANNELS=1
