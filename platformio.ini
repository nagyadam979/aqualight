[env:aqualight]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts =
    pre:tools/generate_mesh_config.py
    pre:tools/generate_web_assets.py
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_CONTROL_VERSION=\"1.3.2\"
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    https://github.com/enjoyneering/AHTxx.git#701814ca270a019ae2a66b3371e7829b73769918

; Single-channel board: PWM GPIO4, AHT20 SDA GPIO1 / SCL GPIO0, own OTA channel.
[env:aqualight1ch]
extends = env:aqualight
extra_scripts =
    ${env:aqualight.extra_scripts}
    pre:tools/generate_device_config.py
build_flags =
    ${env:aqualight.build_flags}
    -DLED_HOSTNAME=\"led-control-1ch\"
    -DLED_CHANNELS=1

; Android Chrome pilot: BLE only, no Wi-Fi association/AP, ESP-NOW or cloud worker.
[env:aqualight_ble]
extends = env:aqualight
extra_scripts =
    pre:tools/generate_ble_config.py
    pre:tools/generate_web_assets.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_CONTROL_VERSION=\"1.4.0-ble\"
    -DLED_BLE_ONLY=1
lib_deps =
    ${env:aqualight.lib_deps}
    h2zero/NimBLE-Arduino@2.5.2
